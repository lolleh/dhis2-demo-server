# DO NOT use this Docker Compose file in production! 
# See the production oriented example under development instead - https://github.com/dhis2/docker-deployment

x-web-base: &web-base
  image: "${DHIS2_IMAGE:-dhis2/core-dev:latest}"
  volumes:
    - ./docker/log4j2.xml:/opt/dhis2/log4j2.xml:ro
  environment:
    # JAVA_TOOL_OPTIONS: Standard JVM environment variable, works with all image types
    # (both tomcat-based dhis2/core-dev:latest and distroless dhis2/core-dev:local)
    JAVA_TOOL_OPTIONS:
      "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8081 \
      -Dlog4j2.configurationFile=/opt/dhis2/log4j2.xml
      -Djava.rmi.server.hostname=127.0.0.1 \
      -Dcom.sun.management.jmxremote \
      -Dcom.sun.management.jmxremote.port=9010 \
      -Dcom.sun.management.jmxremote.local.only=false \
      -Dcom.sun.management.jmxremote.authenticate=false \
      -Dcom.sun.management.jmxremote.ssl=false"
    DB_HOSTNAME: ${DB_HOSTNAME:-db}
    DB_NAME: ${DB_NAME:-dhis}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}

x-db-base: &db-base
  image: ghcr.io/baosystems/postgis:16-3.5
  # uncomment to enable query logging
  # command:
  #   ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
  volumes:
    - db-dump:/docker-entrypoint-initdb.d/
  environment:
    POSTGRES_USER: ${DB_USERNAME}
    POSTGRES_DB: ${DB_NAME:-dhis}
    POSTGRES_PASSWORD: &postgres_password ${DB_USERNAME}
    PGPASSWORD: *postgres_password # needed by psql in healthcheck
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'psql --no-password --quiet --username $$POSTGRES_USER postgres://127.0.0.1/$$POSTGRES_DB -p 5432 --command "SELECT ''ok''" > /dev/null',
      ]
    start_period: 120s
    interval: 1s
    timeout: 3s
    retries: 5
  depends_on:
    db-dump:
      condition: service_completed_successfully # make sure the DB dump has been downloaded

services:
  web:
    <<: *web-base
    volumes:
      - ./docker/log4j2.xml:/opt/dhis2/log4j2.xml:ro
      - ./docker/dhis.conf:/opt/dhis2/dhis.conf:ro
      - ./custom-login:/custom-login:ro
      - ./docker/start-with-custom-login.sh:/start-with-custom-login.sh:ro
    command: sh /start-with-custom-login.sh
    ports:
      - "127.0.0.1:8091:8080" # DHIS2
      - "127.0.0.1:8089:8081" # Debugger
      - "127.0.0.1:9011:9010" # JMX port
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *db-base
    volumes:
      - db-dump:/docker-entrypoint-initdb.d/:ro
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"

  # OpenMRS 2.8.9 + full PIH EMR module set + Initializer 2.12 + O3 SPA
  # (partnersinhealth/pihsl-emr). Uses the OMRS_* env convention (see
  # /openmrs/startup-init.sh inside the image).
  openmrs-db:
    image: mysql:5.7
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci"
    environment:
      MYSQL_DATABASE: ${OPENMRS_DB_NAME:-openmrs}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD:-Admin123}
      MYSQL_USER: ${OPENMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:-Admin123}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - openmrs-pihsl-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

  openmrs:
    image: ${OPENMRS_IMAGE:-partnersinhealth/pihsl-emr:latest}
    depends_on:
      openmrs-db:
        condition: service_healthy
    environment:
      OMRS_DB: mysql
      OMRS_DB_HOSTNAME: openmrs-db
      OMRS_DB_PORT: '3306'
      OMRS_DB_NAME: ${OPENMRS_DB_NAME:-openmrs}
      OMRS_DB_USERNAME: ${OPENMRS_DB_USER:-openmrs}
      OMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:-Admin123}
      OMRS_ADMIN_USER_PASSWORD: ${OPENMRS_PASSWORD:-Admin123}
      OMRS_ADMIN_PASSWORD_LOCKED: 'false'
      OMRS_AUTO_UPDATE_DATABASE: 'true'
      OMRS_CREATE_TABLES: 'true'
      OMRS_MODULE_WEB_ADMIN: 'true'
      OMRS_SEARCH: lucene
      # Lean default heap in the image (-XX:NewSize=128m) is too small for the
      # full PIH SL module set + Initializer config run.
      OMRS_JAVA_MEMORY_OPTS: "-Xms512m -Xmx4g -XX:NewSize=128m"
      # PIH SL config profile loaded on startup (same default the image ships).
      # Active site config lives in pih/config/pih-config-sierraLeone-*.json
      # (one active at a time). Switch with:
      #   OPENMRS_PIH_CONFIG=sierraLeone,sierraLeone-falaba docker compose up -d openmrs
      OMRS_EXTRA_pih_config: ${OPENMRS_PIH_CONFIG:-sierraLeone,sierraLeone-mongo}
      # Let Initializer load the baked-in PIH SL config on startup. 'continue_on_error'
      # keeps the server bootable if an individual domain fails to load.
      OMRS_EXTRA_initializer_startup_load: continue_on_error
    ports:
      - "127.0.0.1:8090:8080" # OpenMRS UI: http://localhost:8090/openmrs (O3 SPA)
    volumes:
      # App data (modules, config checksums, Lucene index, complex obs, runtime
      # properties). Startup wipes the modules/config/frontend subfolders and
      # re-copies them from the image's distribution dir on every boot.
      - openmrs-pihsl-data:/openmrs/data
    healthcheck:
      # Real readiness check: session REST endpoint returns 2xx (or a login
      # redirect) once the OpenMRS context is up. First boot runs the whole
      # PIH SL Initializer load, so allow a long start period.
      test: ["CMD-SHELL", "code=$$(curl -sk -o /dev/null -w '%{http_code}' http://localhost:8080/openmrs/ws/rest/v1/session || echo 000); case $$code in 000|5*) exit 1;; *) exit 0;; esac"]
      start_period: 1500s
      interval: 30s
      timeout: 10s
      retries: 60

  # Test synchronizing data and metadata between two DHIS2 instances
  # Run
  #   docker compose --profile sync up

  web-sync:
    <<: *web-base
    volumes:
      - ./docker/log4j2.xml:/opt/dhis2/log4j2.xml:ro
      - ./docker/dhis-sync.conf:/opt/dhis2/dhis.conf:ro
    profiles: [sync]
    ports:
      - "127.0.0.1:8082:8080" # DHIS2
      - "127.0.0.1:8083:8081" # Debugger: connect using commandline flag -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8083
      - "127.0.0.1:9012:9010" # JMX port (for example for VisualVM)
    depends_on:
      db-sync:
        condition: service_healthy

  db-sync:
    <<: *db-base
    profiles: [sync]
    ports:
      - "127.0.0.1:5434:5432"

  my-app:
    build: ./my-app
    image: dhis2-demo-my-app:latest
    working_dir: /app
    command: sh -c "rm -rf .d2 && npm start"
    volumes:
      # Hot-reload source; keep node_modules from the built image (anonymous
      # volume shadows the bind mount so host deps are never required).
      - ./my-app:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - web

  bridge:
    build: ./bridge
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DHIS2_URL: http://web:8080
      DHIS2_USERNAME: admin
      DHIS2_PASSWORD: district
      OPENMRS_URL: ${OPENMRS_URL:-http://openmrs:8080/openmrs}
      OPENMRS_USERNAME: ${OPENMRS_USERNAME:-admin}
      OPENMRS_PASSWORD: ${OPENMRS_PASSWORD:-Admin123}
      OPENMRS_TLS_INSECURE: ${OPENMRS_TLS_INSECURE:-false}
      OPENMRS_TLS_CA_FILE: ${OPENMRS_TLS_CA_FILE:-}
      OPENMRS_TLS_CERT_FILE: ${OPENMRS_TLS_CERT_FILE:-}
      OPENMRS_TLS_KEY_FILE: ${OPENMRS_TLS_KEY_FILE:-}
      DHIS2_TLS_INSECURE: ${DHIS2_TLS_INSECURE:-false}
      DHIS2_TLS_CA_FILE: ${DHIS2_TLS_CA_FILE:-}
      DHIS2_TLS_CERT_FILE: ${DHIS2_TLS_CERT_FILE:-}
      DHIS2_TLS_KEY_FILE: ${DHIS2_TLS_KEY_FILE:-}
      OPENMRS_DB_HOST: ${OPENMRS_DB_HOST:-openmrs-db}
      OPENMRS_DB_PORT: ${OPENMRS_DB_PORT:-3306}
      OPENMRS_DB_NAME: ${OPENMRS_DB_NAME:-openmrs}
      OPENMRS_DB_USER: ${OPENMRS_DB_USER:-openmrs}
      OPENMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:-Admin123}
      COMMCARE_DOMAIN: ${COMMCARE_DOMAIN:-}
      COMMCARE_API_KEY: ${COMMCARE_API_KEY:-}
      COMMCARE_USERNAME: ${COMMCARE_USERNAME:-}
      COMMCARE_APP_ID: ${COMMCARE_APP_ID:-}
    volumes:
      - ./bridge/src:/app/src
      - bridge-data:/app/data
      # Optional: TLS material for external https servers. Create ./certs and
      # uncomment, then reference OPENMRS_TLS_CA_FILE=/app/certs/... in .env
      # - ./certs:/app/certs:ro
    depends_on:
      web:
        condition: service_started
      openmrs:
        condition: service_healthy

  init-admin:
    image: curlimages/curl:latest
    command: sh /docker/init-admin-user.sh
    volumes:
      - ./docker:/docker:ro
    depends_on:
      web:
        condition: service_started

  db-dump:
    image: busybox # busybox wget version does not have --no-clobber, so we need to do the [ -f ] test
    command: sh -c '[ -f dump.sql.gz ] && echo "dump.sql.gz exists" || wget --output-document dump.sql.gz $$DHIS2_DB_DUMP_URL' # only download file if it does not exist
    environment:
      DHIS2_DB_DUMP_URL: "${DHIS2_DB_DUMP_URL:-https://databases.dhis2.org/sierra-leone/dev/dhis2-db-sierra-leone.sql.gz}"
    working_dir: /opt/dump
    volumes:
      - db-dump:/opt/dump

volumes:
  db-dump: {}
  pg-data:
  bridge-data:
  openmrs-pihsl-db-data:
  openmrs-pihsl-data:
